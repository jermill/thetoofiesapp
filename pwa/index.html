<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#fefae7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Toofies" />
    <meta
      name="description"
      content="Enjoy dessert with a little more awareness and zero guilt."
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Toofies</title>
    <!-- cache-bust marker: splash-v11-walk -->
    <link rel="preload" as="image" href="/mascot/toofie-sprite-walk-cycle.png?v=8" />
    <link rel="preload" as="image" href="/mascot/toofie-splash.png?v=10" />
    <style>
      /* First-paint splash - CSS walk strip until React mounts */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(600px 320px at 50% 30%, rgba(244, 194, 194, 0.35), transparent 60%),
          #fefae7;
        font-family: Outfit, system-ui, sans-serif;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #boot-splash .boot-walk {
        width: 168px;
        height: 168px;
        overflow: hidden;
        position: relative;
        animation: boot-stroll 1.6s ease-in-out infinite;
      }
      /* Tall walk cells (192×1024) → crop to character band in a 168 box */
      #boot-splash .boot-walk-strip {
        width: 168px;
        height: 168px;
        background-image: url('/mascot/toofie-sprite-walk-cycle.png?v=8');
        background-repeat: no-repeat;
        background-size: 600.576px 400.384px;
        background-position: 46.464px -116.192px;
        animation: boot-walk-frames 0.8s steps(8) infinite;
      }
      #boot-splash .boot-brand {
        margin: 8px 0 0;
        font-family: Anton, Impact, sans-serif;
        font-size: 34px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #1a1a1a;
      }
      #boot-splash .boot-label {
        margin: 0;
        color: #5c5c5c;
        font-size: 14px;
      }
      @keyframes boot-walk-frames {
        from { background-position: 46.464px -116.192px; }
        to { background-position: -554.112px -116.192px; }
      }
      @keyframes boot-stroll {
        0%, 100% { transform: translateX(-10px); }
        50% { transform: translateX(10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-walk,
        #boot-splash .boot-walk-strip {
          animation: none !important;
        }
      }
    </style>
    <script>
      /* One-shot: drop stale SW/caches that still show the dashed orbit */
      (function () {
        var EPOCH = 'splash-v11-walk';
        try {
          if (localStorage.getItem('toofies-cache-epoch') === EPOCH) return;
          localStorage.setItem('toofies-cache-epoch', EPOCH);
        } catch (e) {
          return;
        }
        var reload = false;
        var finish = function () {
          if (reload) location.reload();
        };
        var pending = 0;
        var track = function (p) {
          pending++;
          Promise.resolve(p)
            .catch(function () {})
            .then(function () {
              pending--;
              if (pending === 0) finish();
            });
        };
        if ('serviceWorker' in navigator) {
          track(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (regs.length) reload = true;
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }),
          );
        }
        if ('caches' in window) {
          track(
            caches.keys().then(function (keys) {
              if (keys.length) reload = true;
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }),
          );
        }
        if (pending === 0) finish();
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-walk">
          <div class="boot-walk-strip" role="img" aria-label="Toofie walking"></div>
        </div>
        <p class="boot-brand">Toofies</p>
        <p class="boot-label">Warming up the bakery…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
